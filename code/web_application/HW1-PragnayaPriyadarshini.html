<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HW1-Pragnaya-Priyadarshini</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<h1>Municipal Transit Incident Report</h1>

<form id="incidentForm">
  <label for="routeId">Route / Line *</label>
  <input type="text" id="routeId" placeholder="e.g., Line 22 or BART Red Line" required autofocus>

  <label for="location">Stop / Station / Intersection *</label>
  <input type="text" id="location" placeholder="e.g., Downtown Transit Center" required>

  <label for="submitterEmail">Your Email *</label>
  <input type="email" id="submitterEmail" placeholder="you@example.com" required>

  <label for="description">Incident Description *</label>
  <textarea id="description" rows="4" placeholder="Describe what happened..minimum 25 characters" required minlength="25"></textarea>

  <label for="category">Category *</label>
  <select id="category" required>
    <option value="" disabled selected>Choose a category</option>
    <option value="Delay">Delay</option>
    <option value="Mechanical Failure">Mechanical Failure</option>
    <option value="Accident/Collision">Accident/Collision</option>
    <option value="Safety Hazard">Safety Hazard</option>
  </select>

  <div class="checkbox-row">
    <input type="checkbox" id="agreeTerms" />
    <label for="agreeTerms">I agree to the terms and conditions.</label>
  </div>

  <button type="submit">Report Incident</button>
</form>

<section class="panel" id="homeView">
  <h2>Reported Incidents</h2>

  <div class="search-row">
    <label for="searchBox" class="sr-only">Search incidents</label>
    <input type="text" id="searchBox" placeholder="Search by route or location">
    <button type="button" id="searchBtn">Search</button>
    <button type="button" id="clearSearchBtn" class="btn-secondary">Clear</button>
  </div>

  <!-- Exactly one of these four is visible at a time. -->
  <div id="listLoading" class="state state-loading" hidden>
    <span class="spinner"></span>Loading incidents…
  </div>

  <div id="listEmpty" class="state state-empty" hidden>
    No incidents to show.
  </div>

  <div id="listError" class="state state-error" hidden>
    <strong>Could not load incidents.</strong>
    <div id="listErrorDetail"></div>
    <button type="button" id="retryBtn">Try again</button>
  </div>

  <ul id="incidentList" hidden></ul>

  <div class="actions">
    <button type="button" id="updateFirstBtn">Update incident #1</button>
    <button type="button" id="deleteHighestBtn" class="btn-secondary">Delete newest</button>
  </div>
</section>

<script src="hw1.js"></script>
</body>
</html>
