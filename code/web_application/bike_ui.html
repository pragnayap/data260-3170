<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bike-share advisor - HW7 Part 4</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2330; --muted:#5b6678; --line:#dfe3ea;
          --accent:#1f6feb; --good:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f141b; --card:#171d27; --ink:#e6eaf0; --muted:#97a3b6; --line:#2a3342;
            --accent:#58a6ff; --good:#3fb950; --warn:#d29922; --bad:#f85149; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, system-ui, "Segoe UI", sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:20px; margin:0 0 2px; } .sub { color:var(--muted); margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px;
          padding:14px 16px; margin-bottom:14px; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em;
             color:var(--muted); margin:0 0 10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:3px; }
  input { font:inherit; padding:7px 9px; border:1px solid var(--line); border-radius:6px;
          background:var(--bg); color:var(--ink); }
  input[type=url] { min-width:340px; } .grow { flex:1; }
  button { font:inherit; font-weight:600; padding:8px 18px; border:0; border-radius:6px;
           background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  #status { color:var(--muted); font-size:13px; margin-top:8px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } input[type=url]{min-width:0;width:100%;} }
  .step { border-left:3px solid var(--accent); padding:4px 0 4px 10px; margin-bottom:10px; }
  .step.fail { border-color:var(--bad); }
  .step b { font-size:13px; } .step small { color:var(--muted); }
  .step pre { margin:3px 0 0; white-space:pre-wrap; word-break:break-word; font-size:12px;
              color:var(--muted); max-height:90px; overflow:auto; }
  table { border-collapse:collapse; width:100%; font-size:13.5px; }
  th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--muted); font-weight:600; } td.n, th.n { text-align:right; font-variant-numeric:tabular-nums; }
  .badge { display:inline-block; padding:5px 12px; border-radius:20px; font-weight:700; color:#fff; }
  .badge.member { background:var(--good); } .badge.payg { background:var(--warn); }
  .strip { display:flex; gap:10px; flex-wrap:wrap; }
  .metric { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
  .metric small { display:block; color:var(--muted); font-size:11px; text-transform:uppercase; }
  .metric span { font-weight:700; font-size:16px; }
  .chip { font-size:12px; padding:2px 8px; border-radius:10px; border:1px solid var(--line); margin-right:6px; }
  .chip.ok { color:var(--good); } .chip.no { color:var(--bad); }
  .muted { color:var(--muted); } .cite { font-size:13px; word-break:break-all; }
  ul { margin:4px 0 0 18px; padding:0; }
</style>
</head>
<body>
<main>
  <h1>Bike-share advisor</h1>
  <p class="sub">Capital Bikeshare · ReAct/MRKL agent · SID4 3170 · membership vs pay-per-use</p>

  <section class="card" id="login-card">
    <h2>1 · Sign in (JWT)</h2>
    <div class="row">
      <label>Username <input id="user" value="writer" autocomplete="username"></label>
      <label>Password <input id="pass" type="password" autocomplete="current-password"></label>
      <button id="login" type="button">Sign in</button>
      <span id="who" class="muted"></span>
    </div>
  </section>

  <section class="card">
    <h2>2 · Run</h2>
    <div class="row">
      <label>Trips CSV <input id="csv" type="file" accept=".csv"></label>
      <label class="grow">Pricing page URL
        <input id="url" type="url" value="https://capitalbikeshare.com/pricing"></label>
      <button id="run" type="button" disabled>Run</button>
    </div>
    <div id="status"></div>
  </section>

  <div class="grid">
    <section class="card"><h2>Tool-call timeline</h2><div id="timeline" class="muted">Nothing yet.</div></section>
    <section class="card" id="results"><h2>Results</h2><div id="out" class="muted">Run the agent to see the recommendation.</div></section>
  </div>
</main>

<script>
  let token = null, timer = null;
  const $ = (id) => document.getElementById(id);
  const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
  const money = (v) => typeof v === "number" ? "$" + v.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "n/a";
  const auth = () => ({ Authorization: "Bearer " + token });

  $("login").onclick = async () => {
    const res = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: $("user").value, password: $("pass").value }) });
    if (!res.ok) { $("who").textContent = "Login failed (" + res.status + ")"; token = null; $("run").disabled = true; return; }
    token = (await res.json()).access_token;
    const me = await (await fetch("/auth/me", { headers: auth() })).json();
    $("who").textContent = "Signed in as " + me.username + " (" + me.role + ")";
    $("run").disabled = false;
  };

  $("run").onclick = async () => {
    const file = $("csv").files[0];
    if (!file) { $("status").textContent = "Choose a trips CSV first."; return; }
    const form = new FormData();
    form.append("file", file); form.append("url", $("url").value);
    $("run").disabled = true; $("timeline").replaceChildren(el("span", "Starting...", "muted"));
    $("out").replaceChildren(el("span", "Agent is working...", "muted"));
    const res = await fetch("/api/bike/run", { method: "POST", headers: auth(), body: form });
    if (!res.ok) { $("status").textContent = "Error " + res.status + ": " + ((await res.json()).detail || ""); $("run").disabled = false; return; }
    const { job_id, rows } = await res.json();
    $("status").textContent = "Job " + job_id + " · " + rows + " trip rows";
    clearInterval(timer); timer = setInterval(() => poll(job_id), 2000);
  };

  async function poll(id) {
    const res = await fetch("/api/bike/jobs/" + id, { headers: auth() });
    if (!res.ok) return;
    const job = await res.json();
    renderTimeline(job.timeline);
    $("status").textContent = "Job " + id + " · " + job.status + " · " + job.timeline.length + " tool calls so far";
    if (job.status === "done") { clearInterval(timer); renderResult(job.result); $("run").disabled = false; }
    if (job.status === "error") { clearInterval(timer); $("out").replaceChildren(el("span", "Run failed: " + job.error, "chip no")); $("run").disabled = false; }
  }

  function renderTimeline(events) {
    if (!events.length) return;
    $("timeline").replaceChildren(...events.map((ev) => {
      const d = el("div", undefined, "step" + (ev.success ? "" : " fail"));
      const head = el("b", "#" + ev.step + " " + ev.tool);
      head.append(el("small", "  +" + ev.t_s + "s"));
      d.append(head, el("pre", "input: " + JSON.stringify(ev.input)), el("pre", "observation: " + ev.observation));
      return d;
    }));
  }

  function metric(label, value) { const m = el("div", undefined, "metric"); m.append(el("small", label), el("span", String(value))); return m; }

  function table(headers, rows, numFrom) {
    const t = el("table"), hr = el("tr");
    headers.forEach((h, i) => hr.append(el("th", h, i >= numFrom ? "n" : "")));
    t.append(hr);
    rows.forEach((r) => { const tr = el("tr"); r.forEach((c, i) => tr.append(el("td", c, i >= numFrom ? "n" : ""))); t.append(tr); });
    return t;
  }

  function renderResult(r) {
    const ref = r.reference, ans = r.answer || {}, out = $("out");
    const decision = ans.decision || ref.decision;
    const badge = el("span", decision, "badge " + (decision.startsWith("Buy") ? "member" : "payg"));
    const strip = el("div", undefined, "strip");
    strip.append(metric("Steps", r.step_count), metric("Total time", r.total_time_s + " s"),
                 metric("Stop reason", r.stop_reason), metric("Tokens", r.tokens));

    const checks = el("div");
    Object.entries(r.agent_vs_reference).forEach(([k, v]) =>
      checks.append(el("span", (v ? "✓ " : "✗ ") + k.replaceAll("_", " "), "chip " + (v ? "ok" : "no"))));

    const cost = table(["", "Agent", "Verified"], [
      ["Pay per use", money(ans.pay_per_use_total), money(ref.pay_per_use_total)],
      ["Membership fee (" + ref.months_spanned + " mo × $10)", "", money(ref.membership_fee_total)],
      ["Membership overage residual", "", money(ref.membership_residual)],
      ["Membership total", money(ans.membership_total), money(ref.membership_total)],
    ], 1);

    const be = table(["Per month", "Actual", "Break-even"], [
      ["Rides", ref.actual_rides_per_month, ref.break_even_rides_per_month],
      ["Minutes", ref.actual_minutes_per_month, ref.break_even_minutes_per_month],
    ], 1);

    const shown = ref.weekly.slice(0, 8);
    const weekly = table(["Week", "Rides", "Avg min", "Pay-per-use $", "Member residual $"],
      shown.map((w) => [w.week, w.rides, w.avg_minutes, w.pay_per_use_spend.toFixed(2), w.member_residual.toFixed(2)]), 1);

    const cites = el("div", undefined, "cite");
    r.citations.forEach((c) => cites.append(el("div", c.url + " · captured " + c.accessed_at + " · sha256 " + String(c.sha256).slice(0, 16) + "…")));

    const sections = [
      badge, el("p", ans.justification || r.raw_final || "(no justification returned)"),
      strip, el("h2", "Cost comparison"), cost, el("h2", "Break-even vs actual"), be,
      el("h2", "By week (first " + shown.length + " of " + ref.weekly.length + ")"), weekly,
      el("h2", "Citations"), cites, el("h2", "Agent vs verified"), checks,
    ];
    if ((ans.assumptions || []).length) {
      const ul = el("ul"); ans.assumptions.forEach((a) => ul.append(el("li", String(a))));
      sections.push(el("h2", "Assumptions and caveats"), ul);
    }
    out.replaceChildren(...sections);
  }
</script>
</body>
</html>
