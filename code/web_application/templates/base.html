<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Municipal Transit Incidents{% endblock %}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous">
  <style>
    body { background-color: #f4f6f9; }
    .app-shell { max-width: 960px; }
    .brand-dot {
      display: inline-block; width: .6rem; height: .6rem;
      border-radius: 50%; background: #ffc107; margin-right: .45rem;
    }
    footer { font-size: .85rem; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
  <div class="container app-shell">
    <a class="navbar-brand" href="/">
      <span class="brand-dot"></span>Transit Incident Desk
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav" aria-controls="navbarNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        {% if user %}
          <li class="nav-item"><a class="nav-link" href="/dashboard">Dashboard</a></li>
          <li class="nav-item">
            <span class="navbar-text me-lg-3">Signed in as <strong>{{ user.display_name }}</strong></span>
          </li>
          <li class="nav-item"><a class="btn btn-outline-light btn-sm" href="/logout">Log out</a></li>
        {% else %}
          <li class="nav-item"><a class="btn btn-warning btn-sm" href="/login">Log in</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

<main class="container app-shell flex-grow-1 py-5">
  {% block content %}{% endblock %}
</main>

<footer class="bg-dark text-secondary py-3 mt-auto" data-bs-theme="dark">
  <div class="container app-shell d-flex justify-content-between flex-wrap">
    <span>DATA&nbsp;260 &middot; HW3 &middot; DOMAIN_ID&nbsp;2 &mdash; Municipal Transit Incidents</span>
    <span>PREFIX s3170 &middot; port 8470</span>
  </div>
</footer>

<script
  src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
  crossorigin="anonymous"></script>
</body>
</html>
