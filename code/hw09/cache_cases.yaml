# HW9 Part 3.1 - 40 labeled domain queries for the semantic-cache threshold sweep.
# Labels are fixed BEFORE any threshold result exists. Do not edit after the sweep; document mistakes
# separately in reports/hw09/LABEL_NOTES.md.
#
# `seeds` are the 20 questions answered once by the HW8 agent path and stored in the cache before the cases run.
# Each case says what it should do (expect: hit | miss) and, via `key`, how the correct answer is derived
# from the s3170_rel tables (code/hw09/qa_agent.py ground_truth()).
version: 1
sid4: 3170
prefix: s3170
embedding_model: sentence-transformers/all-MiniLM-L6-v2

seeds:
  - {id: S01, query: "What agency operates route R-0002?", key: {kind: agency, route: R-0002}}
  - {id: S02, query: "How many incidents are recorded for route R-0012?", key: {kind: incident_count, route: R-0012}}
  - {id: S03, query: "What type of route is R-0021?", key: {kind: route_type, route: R-0021}}
  - {id: S04, query: "How many Delay incidents are recorded for route R-0018?", key: {kind: category_count, route: R-0018, category: Delay}}
  - {id: S05, query: "What is the total number of riders affected on route R-0015?", key: {kind: riders_total, route: R-0015}}
  - {id: S06, query: "What is the name of route R-0033?", key: {kind: route_name, route: R-0033}}
  - {id: S07, query: "Which agency runs route R-0042?", key: {kind: agency, route: R-0042}}
