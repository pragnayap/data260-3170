# HW8 - Kafka (single-node KRaft) + the entity worker + the FastAPI wrapper.
#   host tools reach Kafka at localhost:9092; containers reach it at kafka:29092.
#   the API is published on PORT_BASE 8470, so stop any local uvicorn on 8470 first.
services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: s3170_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 30

  worker:
    build:
      context: .
      dockerfile: code/hw08/Dockerfile
    container_name: s3170_worker
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TZ: "PST8PDT,M3.2.0,M11.1.0"     # log in local (Pacific) time, like the host-side scripts
    depends_on:
      kafka:
        condition: service_healthy
    command: ["python", "worker.py"]

  api:
    build:
      context: .
      dockerfile: code/hw08/Dockerfile
    container_name: s3170_api
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TZ: "PST8PDT,M3.2.0,M11.1.0"
    ports:
      - "8470:8470"
    depends_on:
      kafka:
        condition: service_healthy
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8470"]
